plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Firebase values (from google-services.json) — see ../firebase.properties.example
def fb = new Properties()
def fbFile = rootProject.file('firebase.properties')
if (fbFile.exists()) fbFile.withInputStream { fb.load(it) }
def fbVal = { k -> (fb.getProperty(k) ?: '').trim() }

// Same signing key as the earlier Print Flow APK so this installs as an update
def ks = new Properties()
def ksFile = rootProject.file('../android/keystore.properties')
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'io.github.bossza553.printflow'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.bossza553.printflow'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '2.1'
        buildConfigField 'String', 'WEB_URL', '"https://bossza553.github.io/print-flow/"'
        buildConfigField 'String', 'API_BASE', '"https://npobptbcnxsonbevfgrr.supabase.co/functions/v1"'
        buildConfigField 'String', 'FB_PROJECT_ID', "\"${fbVal('projectId')}\""
        buildConfigField 'String', 'FB_SENDER_ID', "\"${fbVal('senderId')}\""
        buildConfigField 'String', 'FB_APP_ID', "\"${fbVal('appId')}\""
        buildConfigField 'String', 'FB_API_KEY', "\"${fbVal('apiKey')}\""
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file('../android/' + ks.getProperty('storeFile'))
                storePassword ks.getProperty('storePassword')
                keyAlias ks.getProperty('keyAlias')
                keyPassword ks.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity-ktx:1.9.3'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'com.google.firebase:firebase-messaging:24.1.0'
}
